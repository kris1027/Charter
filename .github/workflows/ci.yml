name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-format-test-build:
        name: Lint, Format, Test & Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            # Per route JS budgets from perf/budgets.json; the table also goes to the job summary
            - name: JS size budgets
              run: pnpm perf:size

            # dist/.vite (the manifest) is a dot folder, so it's left out; Lighthouse doesn't need it
            - name: Upload build
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  retention-days: 1

